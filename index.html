<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YatraDham.Org Property Performance Report System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--o:#E8730C;--od:#C75B00;--g:#B8893B;--c:#2B2420}
*{box-sizing:border-box}
body{margin:0;background:#F3EDE4;color:var(--c);font-family:Arial,Helvetica,sans-serif}
header{background:#fff;border-bottom:3px solid var(--o);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:36px}.ttl{font-family:Arial,Helvetica,sans-serif;font-weight:700}.sub{font-size:12px;color:#8a7b70}
main{max-width:1400px;margin:0 auto;padding:24px;display:grid;gap:28px;grid-template-columns:1fr}
@media(min-width:1000px){main{grid-template-columns:400px 1fr}.panel{position:sticky;top:20px;align-self:start}}
.panel{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.08);border:1px solid #EFE2D0}
.panel h2{font-family:Arial,Helvetica,sans-serif;margin:0 0 4px}.panel p{margin:0 0 14px;font-size:13px;color:#8a7b70}
label{display:block;margin-bottom:12px;font-size:13px;font-weight:600}
input{width:100%;margin-top:4px;padding:11px 12px;border:1px solid #E6D3BB;border-radius:10px;font:inherit;font-weight:400}
input:focus{outline:2px solid var(--o);border-color:transparent}.hint{font-size:11px;color:#8a7b70;font-weight:400}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.int{background:#FFF6EA;border:1px dashed #E6B77A;border-radius:12px;padding:12px;margin-bottom:14px}
.int small{display:block;font-size:11px;color:#8a7b70;margin-top:4px}
button{cursor:pointer;font:inherit;font-weight:700;border-radius:12px}
#dl{width:100%;padding:15px;font-size:17px;color:#fff;background:linear-gradient(135deg,#F28A1E,#C75B00);border:0;box-shadow:0 6px 14px rgba(232,115,12,.3)}
#dl:disabled{opacity:.6}
#rs{width:100%;margin-top:10px;padding:10px;background:#fff;border:1px solid #d6cdc4;color:#5b4f47}
#msg{font-size:12px;margin-top:10px;min-height:16px;color:#8a7b70;text-align:center}
.cap{font-size:12px;font-weight:700;color:#8a7b70;margin-bottom:10px;letter-spacing:1px}
#box{max-width:794px;margin:0 auto;width:100%}
#page-frame{overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.2);background:#fff}
#page-scale{transform-origin:top left;width:794px;height:1123px}
/* ===== A4 report ===== */
#rp{width:794px;height:1123px;background:#fff;position:relative;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#2B2420}
.top{height:10px;background:linear-gradient(90deg,#C75B00,#F28A1E,#B8893B)}
.in{padding:0 58px}
.lgw{text-align:center;padding-top:38px}.lgw img{height:62px}
.wm{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:30px}.wm b{color:var(--o)}
.h1{font-size:40px!important;font-family:Arial,Helvetica,sans-serif;font-size:46px;font-weight:700;text-align:center;margin:30px 0 0;line-height:1.1;letter-spacing:0}
.dv{display:flex;align-items:center;gap:12px;margin:18px 80px 0}.dv i{flex:1;height:1px;background:var(--g)}.dv u{width:8px;height:8px;background:var(--g);transform:rotate(45deg)}
.mo{text-align:center;margin-top:18px}.mo span{display:inline-block;background:#2B2420;color:#fff;border-radius:30px;padding:9px 28px;font-size:14px;font-weight:600;letter-spacing:.5px}.mo b{color:#F5B83A}
.card{background:#fff;border:1px solid #EBDDC8;border-radius:16px;padding:22px 26px;margin-top:20px;box-shadow:0 3px 12px rgba(120,80,20,.07)}
.lb{font-size:10.5px;letter-spacing:2.2px;font-weight:700;color:var(--od);text-transform:uppercase}
.pn{border-left:6px solid var(--o)}.pn .v1{font-family:Arial,Helvetica,sans-serif;font-size:27px;font-weight:700;margin-top:8px;line-height:1.25}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.num{font-family:Arial,Helvetica,sans-serif;font-weight:700;margin-top:12px;line-height:1}
.am2{background:#2B2420;border:0}.am{background:linear-gradient(135deg,#F28A1E,#C75B00);border:0}
.rt{text-align:center}.rr{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:14px}
.st{position:relative;width:200px;height:36px}.st .f{position:absolute;left:0;top:0;overflow:hidden;height:36px}
.sr{display:flex;gap:4px;width:200px}.sr svg{width:36px;height:36px;flex:none}
.big{font-family:Arial,Helvetica,sans-serif;font-size:48px;font-weight:700;color:var(--o);line-height:1}
.sm{margin-top:14px;font-size:11.5px;color:#8a7b70}.sm+div{font-weight:600;font-size:16px;margin-top:2px}
.url{color:var(--od);font-weight:600;font-size:14.5px;text-decoration:underline;word-break:break-all}
.ft{position:absolute;left:0;right:0;bottom:0;height:70px;background:#2B2420;color:#fff;text-align:center;padding-top:15px;border-top:3px solid var(--g)}
.ft b{font-family:Arial,Helvetica,sans-serif;font-size:16px}.ft i{color:#F5B83A;font-style:normal}.ft div{font-size:11px;opacity:.75;margin-top:4px;letter-spacing:1px}
</style></head><body>
<header><div id="hlogo"></div><div style="text-align:right"><div class="ttl">Property Performance Report System</div><div class="sub">Internal tool · v2.1</div></div></header>
<main>
 <section class="panel">
  <h2>Report Details</h2><p>The preview updates as you type.</p>
  <div class="int"><label style="margin:0">Report Creator Name *<input id="creator" placeholder="Your name" autocomplete="name"></label><small>Internal only — not printed in the PDF. Logged with date &amp; time on download.</small></div>
  <label>Report Month<input id="month" placeholder="September 2026"></label>
  <label>Property Name (Dharmshala)<input id="name"></label>
  <div class="g2">
   <label>Customer Rating <span class="hint">(0–5)</span><input id="rating" inputmode="decimal"></label>
   <label>Rating Count<input id="rcount" inputmode="numeric"></label>
   <label>Total Bookings<input id="book" inputmode="numeric"></label>
   <label>Total Amount (₹)<input id="amt" inputmode="numeric"><span class="hint" id="amth"></span></label>
   <label>Total Reject Booking<input id="rej" inputmode="numeric"></label>
   <label>Total Reject Amount (₹)<input id="ramt" inputmode="numeric"><span class="hint" id="ramth"></span></label>
  </div>
  <label>Property URL<input id="url" inputmode="url" placeholder="https://yatradham.org/..."></label>
  <button id="dl">⬇ Download PDF</button>
  <button id="rs">Reset</button>
  <div id="msg"></div>
 </section>
 <section><div class="cap">LIVE A4 PREVIEW — exactly what will be downloaded</div>
  <div id="box"><div id="page-frame"><div id="page-scale"><div id="rp"></div></div></div></div></section>
</main>
<script>
const LOGO_SRC='https://cdn.yatradham.org/skin/frontend/default/ydhome/yd_newtheme/images/logo.png';
const SHEET_URL='https://script.google.com/macros/s/AKfycbz10C67xPzxTtlL3YnLeWBOKermFN4n9HwleA6-BcT6teUMQO2UdXu7gPirqflKiDtq/exec';
let LOGO_DATA='';
const SAMPLE={month:'September 2026',name:'Shri Krishna Beriwala Smruti Bhavan',rating:'4.5',rcount:'1245',book:'156',amt:'485600',rej:'12',ramt:'38500',url:'https://yatradham.org/'};
const $=id=>document.getElementById(id),F=['month','name','rating','rcount','book','amt','rej','ramt','url'];
const dg=s=>s.replace(/\D/g,''),n=s=>(dg(s)?+dg(s):0).toLocaleString('en-IN'),inr=s=>'₹'+n(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nurl=u=>{u=u.trim();return !u?'':/^https?:\/\//i.test(u)?u:'https://'+u};
const safe=s=>s.trim().replace(/[^\w\s-]/g,'').replace(/\s+/g,'_');
const star='<svg viewBox="0 0 24 24"><path d="M12 2l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 18l-6.4 3.6L7 14.5 1.7 9.5l7.2-.9z"/></svg>';
const row=c=>`<div class="sr" style="fill:${c}">${star.repeat(5)}</div>`;
const wmk=()=>`<div class="wm">YatraDham<b>.Org</b></div>`;
const logo=()=>`<img class="lgimg" src="${LOGO_DATA||LOGO_SRC}" alt="YatraDham.Org">`;
fetch(LOGO_SRC).then(r=>r.blob()).then(b=>new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(f.result);f.readAsDataURL(b)})).then(d=>{LOGO_DATA=d;$('hlogo').innerHTML=logo();render()}).catch(()=>{});
$('hlogo').innerHTML=logo();
const val=()=>Object.fromEntries(F.map(k=>[k,$(k).value]));
function render(){
 const d=val(),r=Math.min(5,Math.max(0,parseFloat(d.rating)||0)),u=nurl(d.url);
 $('amth').textContent='Shown as '+inr(d.amt);$('ramth').textContent='Shown as '+inr(d.ramt);
 $('rp').innerHTML=`<div class="top"></div><div class="in">
 <div class="lgw">${logo()}</div>
 <div class="h1">Property Performance Report</div>
 <div class="dv"><i></i><u></u><i></i></div>
 <div class="mo"><span>Report Month: <b>${esc(d.month)||'—'}</b></span></div>
 <div class="card pn"><div class="lb">Property Name</div><div class="v1">${esc(d.name)||'—'}</div></div>
 <div class="gr"><div class="card"><div class="lb">Total Bookings</div><div class="num" style="font-size:46px">${n(d.book)}</div></div>
 <div class="card am"><div class="lb" style="color:#FFE9CC">Total Booking Amount</div><div class="num" style="font-size:38px;color:#fff;margin-top:16px">${inr(d.amt)}</div></div></div>
 <div class="gr"><div class="card" style="margin-top:16px"><div class="lb">Total Reject Bookings</div><div class="num" style="font-size:36px">${n(d.rej)}</div></div>
 <div class="card am2" style="margin-top:16px"><div class="lb" style="color:#E6D3BB">Total Reject Amount</div><div class="num" style="font-size:32px;color:#fff;margin-top:14px">${inr(d.ramt)}</div></div></div>
 <div class="card rt"><div class="lb">Customer Rating</div><div class="rr"><div class="st">${row('#EADFD0')}<div class="f" style="width:${r/5*200}px">${row('#F5A100')}</div></div><span class="big">${d.rating?r:'—'}</span></div>
 <div style="margin-top:10px;font-size:15px;color:#6B5E55">Based on ${n(d.rcount)} Customer Ratings</div></div>
 <div class="card"><div class="lb">Property Information</div><div class="sm">Property Name</div><div>${esc(d.name)||'—'}</div>
 <div class="sm" style="margin-top:12px">Property URL</div><a data-pdf-link class="url" href="${esc(u)}">${esc(u)||'—'}</a></div></div>
 <div class="ft"><b>Powered by <i>YatraDham.Org</i></b><div>Trusted Pilgrimage Stay Booking Platform</div></div>`;
}
function load(d){F.forEach(k=>$(k).value=d[k]);render()}
F.forEach(k=>$(k).addEventListener('input',e=>{const t=e.target;
 if(['rcount','book','amt','rej','ramt'].includes(k))t.value=dg(t.value);
 if(k==='rating'){const m=t.value.replace(/[^\d.]/g,'').match(/^\d*\.?\d?/);t.value=m?m[0]:''}render()}));
$('rs').onclick=()=>{load(SAMPLE);$('creator').value='';$('msg').textContent=''};
function fit(){const s=Math.min(1,$('box').clientWidth/794);$('page-scale').style.transform=`scale(${s})`;
 $('page-frame').style.width=794*s+'px';$('page-frame').style.height=1123*s+'px'}
new ResizeObserver(fit).observe($('box'));
async function logSheet(name,when,d){
 try{const body=new URLSearchParams({name:name,datetime:when,property:d.name.trim(),bookings:dg(d.book)||'0',bookingAmount:dg(d.amt)||'0',rejects:dg(d.rej)||'0',rejectAmount:dg(d.ramt)||'0',rating:d.rating||'0'});
  await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString()});return true}catch(e){return false}}
$('dl').onclick=async()=>{
 const creator=$('creator').value.trim(),msg=$('msg');
 if(!creator){msg.style.color='#c0392b';msg.textContent='Please enter Report Creator Name first.';$('creator').focus();return}
 const b=$('dl');b.disabled=true;b.textContent='Generating PDF…';msg.style.color='#8a7b70';msg.textContent='';
 try{
  if(document.fonts)await document.fonts.ready;
  const el=$('rp'),d=val(),u=nurl(d.url);
  const cv=await html2canvas(el,{scale:2.5,backgroundColor:'#FFFFFF',useCORS:true,onclone:doc=>{
   if(!LOGO_DATA)doc.querySelectorAll('.lgimg').forEach(i=>i.outerHTML=wmk());
   const s=doc.getElementById('page-scale');s.style.transform='none';
   const f=doc.getElementById('page-frame');f.style.width='794px';f.style.height='1123px';f.style.overflow='visible'}});
  const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
  pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,210,297);
  const a=el.querySelector('[data-pdf-link]');
  if(a&&u){const r=a.getBoundingClientRect(),p=el.getBoundingClientRect(),k=210/p.width;
   pdf.link((r.left-p.left)*k,(r.top-p.top)*k,r.width*k,r.height*k,{url:u})}
  pdf.setProperties({title:'Property Performance Report - '+d.name,author:'YatraDham.Org'});
  pdf.save(`${safe(d.name)||'Property'}_${safe(d.month)||'Month'}_Report.pdf`);
  const when=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
  const ok=await logSheet(creator,when,d);
  msg.style.color=ok?'#2e7d32':'#c0392b';msg.textContent=ok?'✓ Downloaded & logged in Google Sheet ('+when+')':'PDF downloaded, but sheet entry failed. Check internet.';
 }catch(e){console.error(e);msg.style.color='#c0392b';msg.textContent='PDF generation failed: '+(e&&e.message||e)}
 b.disabled=false;b.textContent='⬇ Download PDF'};
load(SAMPLE);fit();
</script></body></html>
